services:

  postgres-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always


  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


  user-service:
    build: ./user_sherbime
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-db:5432/ecommerce
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: always


  product-service:
    build: ./produkt_sherbime
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-db:5432/ecommerce
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: always


  order-service:
    build: ./order_sherbime
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-db:5432/ecommerce
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: always


  notification-service:
    build:
      context: ./notification_service

    ports:
      - "8003:8000"

    environment:
      RABBITMQ_HOST: rabbitmq

    depends_on:
      rabbitmq:
        condition: service_healthy

    restart: always


volumes:
  postgres_data:
