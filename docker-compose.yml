services:

  postgres-db:
    image: postgres:16
    container_name: postgres-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecommerce

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build: ./user_sherbime
    ports:
      - "8000:8000"

    depends_on:
      - postgres-db

  product-service:
    build: ./produkt_sherbime
    ports:
      - "8001:8000"

  order-service:
    build: ./order_sherbime
    ports:
      - "8002:8000"

  notification-service:
    build: ./notification_service
    ports:
      - "8003:8000"

volumes:
  postgres_data:
